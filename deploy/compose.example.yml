# MAEC One Core on the VPS — Core and its own PostgreSQL. An example: copy it to
# deploy/compose.yml on the server and adjust the marked lines.
#
#   cp deploy/compose.example.yml deploy/compose.yml
#   cp deploy/env.production.example deploy/env.production   # then fill it in
#   chmod 600 deploy/env.production
#   docker compose -f deploy/compose.yml --env-file deploy/env.production up -d --build
#
# It sits beside what is already there and changes none of it:
#
#   Caddy (host, :443) ── auth.mirageaec.com ──────▶ 127.0.0.1:8001 ─▶ core :8000
#                      ├─ engtools.mirageaec.com ──▶ 127.0.0.1:8082 ─▶ new Engineering Tools
#                      ├─ et.mirageaec.com ────────▶ 127.0.0.1:8080 ─▶ old Engineering Tools (untouched)
#                      └─ promanage.mirageaec.com ─▶ 127.0.0.1:8081 ─▶ Project Management (untouched)
#   an app's backend ── http://maec-core:8000/api/gate/check ─▶ core  (maec_core_net)
#
# Core starts first and depends on no app. maec_core_net, the network Core
# shares with the apps, belongs to no stack: it is created ONCE on the host,
# before Core's first start, and Core and every app join it as external —
#
#   docker network create --subnet 10.231.1.0/24 --gateway 10.231.1.1 maec_core_net
#
# so no stack's `docker compose down` can take it from the others. Core still
# owns maec_core_private, its own network with its database.
# ProManage, and the old Engineering Tools stack, are untouched. Nothing here
# publishes a port to the internet: Caddy on the host terminates TLS and
# reaches Core through loopback.
#
# Networks — fixed names and ranges, recorded in OPEN-DECISIONS #21. Both are
# outside Docker's default pools (172.17-172.31.x.x, 192.168.x.x) and away
# from the old Engineering Tools stack's 172.30.57.0/24:
#
#   maec_core_private  10.231.0.0/24  Core and its database only; internal;
#                                     created and removed with this stack
#   maec_core_net      10.231.1.0/24  Core and the apps that call the gate;
#                                     created once, by hand, outside every stack
#
# Before the first start, check nothing on the host already uses 10.231.x.x:
#   ip route; docker network inspect $(docker network ls -q) --format '{{.Name}} {{range .IPAM.Config}}{{.Subnet}}{{end}}'

name: maec-core

services:
  core:
    build:
      context: ..
      dockerfile: Dockerfile
    image: maec-core:latest
    restart: unless-stopped
    env_file: env.production
    environment:
      # Built here from the same file the database reads, so the password is
      # written once. Use a hex password (openssl rand -hex 24): no character
      # in it needs escaping in a URL.
      DATABASE_URL: "postgresql+psycopg://maec_core:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in env.production}@core-db:5432/maec_identity"
      # Whose X-Forwarded-For / -Proto Core believes: maec_core_net's GATEWAY,
      # not its range. Caddy reaches Core through the published loopback port,
      # which Docker delivers from that gateway — observed as 10.231.1.1. (The
      # internal network carries no published traffic, so its gateway is not
      # listed.) An app on maec_core_net has an address from .2 up, so it is
      # never trusted to say who a visitor is. OPEN-DECISIONS #6, #21. Change
      # this with maec_core_net's gateway (the network create command), together.
      TRUSTED_PROXIES: "127.0.0.1,10.231.1.1"
    ports:
      # Loopback only. Docker's port publishing sits in front of ufw, so a bare
      # "8001:8000" would be reachable from the internet whatever the firewall
      # says. Change 8001 if something on the host already holds it.
      - "127.0.0.1:8001:8000"
    depends_on:
      core-db:
        condition: service_healthy
    networks:
      core_private: {}
      # Apps call the gate as http://maec-core:8000 on this network.
      maec_core_net:
        aliases: [maec-core]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  core-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: maec_identity
      POSTGRES_USER: maec_core
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in env.production}"
    volumes:
      - core_db:/var/lib/postgresql/data
    # Never published, and only on the internal network: an app joined to
    # maec_core_net cannot even resolve it.
    networks: [core_private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maec_core -d maec_identity"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

networks:
  core_private:
    # Core and its database. Internal: no route out, nothing else on it.
    name: maec_core_private
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.231.0.0/24
          gateway: 10.231.0.1
  maec_core_net:
    # Shared, and no stack's: created once on the host before Core first starts,
    #   docker network create --subnet 10.231.1.0/24 --gateway 10.231.1.1 maec_core_net
    # and joined here, and by every app, as external. Its range and gateway are
    # set by that command, which is why they are not repeated here.
    external: true
    name: maec_core_net

volumes:
  core_db:
