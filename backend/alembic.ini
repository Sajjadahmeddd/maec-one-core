# Alembic for the identity schema.
#
#   alembic -c backend/alembic.ini upgrade head
#   alembic -c backend/alembic.ini revision --autogenerate -m "..."
#
# A convenience copy pointing at identity/migrations, so the command can be
# run from the repository root without naming the package path. The
# authoritative one is backend/identity/alembic.ini, which travels with the
# package; both read DATABASE_URL from the environment, so no connection
# string is ever committed.

[alembic]
script_location = %(here)s/identity/migrations
prepend_sys_path = %(here)s/..
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
